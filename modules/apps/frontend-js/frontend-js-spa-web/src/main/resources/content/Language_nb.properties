disable-in-internet-explorer-11-description=På grunn av en feil i Trident-gjengivelsesmotoren (brukt av IE11), når SPA brukes til sidenavigasjon, vil mediespørringer alltid brukes når bare min bredde eller bare spørringer med maks bredde er angitt, selv om sidebredden ikke samsvarer med disse spørringene. Dette påvirker også tredjeparts iframes på siden. Deaktiver SPA for å omgå dette problemet. (Automatic Translation)
disable-in-internet-explorer-description=For å omgå en feil i Trident rendering motoren (brukes av IE11) og MSHTML rendering motor (brukes av Edge), riktig gjengivelse siden med SPA for tiden krever re-nedlasting av alle CSS-filer på alle sidenavigasjoner for alle Internet Explorer nettlesere, som kan føre til at sider lastes saktere med SPA aktivert enn med SPA deaktivert. Deaktiver SPA for å omgå dette problemet. (Automatic Translation)
